        <pre>
Más allá del tiempo y la noche,
Tenue luz, quebrada voz,
Tierra al fin de espigas y lanzas
Pan y sangre de un pueblo sin señor.

Vuelve a amar, levanta tu rostro,
Y enseña el orgullo  de la verdad.
Yesca y mar, fogones y velas  
Fueros y voces que apagan sin cesar.
